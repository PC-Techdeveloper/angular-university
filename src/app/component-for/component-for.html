<div class="container mt-5">
  <h1 class="text-center fst-italic">{{ title }}</h1>
  <h2 class="text-center">Lista de Tareas</h2>

  <ul class="list-group w-50 mx-auto">
    @for (task of tasks; track task) {
    <li class="list-group-item text-center">
      {{ task }}
    </li>
    }
  </ul>

  <div class="mt-3 d-flex justify-content-center">
    <input type="text" #taskInput class="form-control mb-2 w-50" placeholder="New Task" />
  </div>

  <div class="d-flex justify-content-center">
    <button class="btn btn-primary w-50" (click)="addTask(taskInput.value); taskInput.value = ''">
      <fa-icon [icon]="faListCheck" />
      Agregar Tarea
    </button>
  </div>
</div>
