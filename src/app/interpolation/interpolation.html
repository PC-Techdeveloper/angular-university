<!-- Interpolación en Angular -->
<section>
  <div class="container">
    <h1 class="text-center text-warning my-4">{{title}}</h1>
    <p>Bienvenido, {{user.name}}</p>
    <p>
      Tienes {{user.age}} años
    </p>
    <p>{{sayGreeting()}}</p>
    <p>En un año tendrás {{user.age + 1}} años</p>
  </div>
</section>
