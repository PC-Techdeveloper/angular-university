<div class="container mt-4">
  <h1 class="mt-4 text-warning text-center">{{ title }}</h1>
  <h2 class="fw-light text-center">Agregar Tarea</h2>
  <div class="mt-3 d-flex justify-content-center">
    <!-- Local Reference: #taskInput -->
    <input type="text" #taskInput class="form-control mb-2 w-50" placeholder="Writte your task" />
  </div>
  <div class="d-flex justify-content-center">
    <button class="btn btn-primary" (click)="addTask(taskInput.value); taskInput.value = ''">
      Add Task
    </button>
  </div>

  <div class="mt-3 text-center">
    @if (task){
    <p>Task: {{ task }}</p>
    }
  </div>
</div>
