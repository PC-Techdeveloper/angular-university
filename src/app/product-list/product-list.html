<div class="container mt-3">
  <h1 class="mt-4 text-center text-warning">{{ title }}</h1>
  <ul class="list-group w-50 mx-auto">
    @for (product of products; track product) {
    <li class="list-group-item text-center">
      {{ product.description }}
      {{ product.price }}
    </li>
    }
  </ul>

  <h5 class="text-center text-success mt-3">Agregar Nuevo Producto</h5>

  <form class="d-flex justify-content-between align-items-center my-4 w-50 mx-auto">
    <input
      type="text"
      id="description"
      name="description"
      placeholder="Descripción del producto"
      class="form-control me-2 w-75"
      [(ngModel)]="descriptionInput"
    />
    <input
      type="text"
      id="price"
      name="price"
      placeholder="Precio del producto"
      class="form-control me-2 w-50"
      [(ngModel)]="priceInput"
    />

    <button class="btn btn-primary" type="submit" (click)="addProduct()">Agregar</button>
  </form>
</div>
